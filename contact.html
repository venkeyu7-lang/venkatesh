<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact GameProfolio for collaboration, portfolio features, and student creator opportunities." />
    <title>Contact | GameProfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">GameProfolio</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="blog.html">Blog & Events</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main class="page-shell">
      <section class="section contact-grid">
        <div>
          <h1>Let’s connect</h1>
          <p class="hero-text">Share your goals, event needs, or stream portfolio plans with the GameProfolio team.</p>
          <ul class="contact-list">
            <li>Email: hello@gameprofolio.com</li>
            <li>Instagram: @gameprofolio</li>
            <li>Discord: GameProfolio Network</li>
          </ul>
        </div>
        <form class="contact-card" id="contact-form">
          <label>
            Name
            <input type="text" name="name" placeholder="Your name" required />
          </label>
          <label>
            Email
            <input type="email" name="email" placeholder="you@example.com" required />
          </label>
          <label>
            Message
            <textarea name="message" rows="5" placeholder="Tell us about your project" required></textarea>
          </label>
          <button class="btn btn-primary" type="submit">Send Message</button>
          <p id="form-status" class="form-status"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span id="year"></span> GameProfolio. Built for student creators.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
